# Ruff lint and format check (make lint), mypy (make typecheck) and an import check on the
# oldest and newest supported Python. Does not build or publish.
name: lint
on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'fix/**'
      - 'feat/**'
permissions:
  contents: read
# A newer push to the same branch cancels the older lint run.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Makefile defaults RUFF to .venv/bin/ruff; the runner has no venv.
      - run: make lint
        env:
          RUFF: ruff

  mypy:
    # actions/python-versions has no 3.9 build for ubuntu-latest (26.04); 24.04 has 3.9 and 3.14.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm derives the version from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            setup.cfg
            requirements-dev.txt
      # Package deps are installed so mypy sees jsonschema/requests.
      - run: pip install -e . -r requirements-dev.txt
      - run: python -c "import suprsend; print(suprsend.__version__)"
      # Makefile defaults MYPY to .venv/bin/mypy; the runner has no venv.
      - run: make typecheck
        env:
          MYPY: mypy
