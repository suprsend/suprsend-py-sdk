[build-system]
requires = [
    "setuptools>=64",
    "setuptools-scm>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/suprsend/_version.py"

[tool.ruff]
required-version = ">=0.17.2"
target-version = "py311"          # python_requires = >=3.11 in setup.cfg
line-length = 120                 # AGENT.md
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = false

[tool.ruff.lint]
# Minimal, behaviour-neutral set (syntax/runtime errors, pyflakes, import sorting, implicit Optional).
select = ["E4", "E7", "E9", "F", "I", "RUF013"]  # RUF013: implicit Optional
ignore = [
    # Baseline debt with no safe autofix; remove one entry per follow-up PR.
    "F841",  # unused-variable: 1
    "E722",  # bare-except: 1
]

[tool.ruff.lint.per-file-ignores]
# Re-exports; import order sets the public namespace.
"__init__.py" = ["F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["suprsend"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
files = ["src/suprsend"]
mypy_path = "src"
ignore_missing_imports = true     # python-magic (optional extra) ships no types
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
strict_equality = true
cache_dir = ".mypy_cache"

# Whole package is strict (no ignore_errors baseline). Keep new code strict.
[[tool.mypy.overrides]]
module = ["suprsend.*"]
strict = true
